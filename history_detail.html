  <script src="app.js?v=20261123-v56" integrity="sha256-N0+T2BkWdnMA+QU9cdUUnBhJD+/idZnwXiBobni6E+Y=" crossorigin="anonymous" onerror="window.__ringAppLoadFailed=true;window.addEventListener('DOMContentLoaded',function(){var p=document.createElement('div');p.id='ringAppUpdateError';p.setAttribute('role','alert');p.style.cssText='padding:32px;background:white;color:#18344e;font:16px sans-serif';p.textContent='アプリの更新を確認できません。通信を確認して再読み込みしてください。端末内のデータは保持されています。';var b=document.createElement('button');b.textContent='再読み込み';b.onclick=function(){location.reload();};p.appendChild(b);document.body.replaceChildren(p);},{once:true})"></script>
  <script src="owner-platform.js?v=20261120-v54" integrity="sha256-9NMxbN/nLqDtbnU61091juoQouSv3egfSKXP+W/svSk= sha256-mcbxkbvK1YuwqASWD5iBdNV39empv7e0QH4E3FLqWXk="></script>
  <script src="vendor/qr/qrcode.js?v=20261120-v54" integrity="sha256-GK45n4EYK8nekW6cd7GV3yDMWNby1VpisIWimfG/F4A= sha256-S2Ezy7WhPs3CbPqJfQ2ve7mwgjIDLN04HoLyuvNlO18="></script>
  <script src="owner-platform-ui.js?v=20261120-v54" integrity="sha256-aUZ4ia02+OAe64Vumo6YhCAEHo3qFioEAu/iRTggdCE= sha256-xe4z75QYBNWdg9pczMi45oE6bDwjfBbE6Hxo4JLcx3E="></script>
  <script src="theme.js"></script>

  <style>
    .edit-btn[hidden] { display:none; }
    /* ページ固有のスタイル：オーナーの設計（999pxの丸ボタン等）を完全維持 */
    .edit-btn {
      display: block; width: 100%; text-align: center; padding: 14px;
      border-radius: 999px; background: var(--accent); color: #fff;
      text-decoration: none; font-weight: 900; margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <a onclick="goBackSmart('vehicle_detail.html')" class="back-link">◁ 戻る</a>
    <br>
    <h1 class="title">整備履歴</h1>
  </div>

  <div id="content"></div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const vin = params.get("vin");
  const logId = params.get("log_id");

  /**
   * ストレージから新旧のログを取得して統合
   */
  function getLogs() {
    return ringReadableHistoryRows_().filter(function (r) { return _normalize(r.vin) === _normalize(vin); });
  }

  function render(showOverlay) {
    if (showOverlay !== false) {
      showLoading("読込中", "読み込み中…");
    }

    setTimeout(() => {
      const logs = getLogs();
      const log = logs.find(l => l.log_id == logId);

      if (!log) {
        document.getElementById("content").innerHTML = `
          <div class="card" style="text-align:center; color:var(--muted); font-weight:800;">
            データが見つかりませんでした。
          </div>`;
        hideLoading();
        return;
      }

      var visToggle = (window.ringOwnerPlatformUi && log) ? window.ringOwnerPlatformUi.buildDetailVisibilityToggle(log) : '';
      document.getElementById("content").innerHTML = visToggle + `
        <div class="card">
          <div class="field">
            <span class="label">日付</span>
            <div class="value"><span data-log-field="date"></span></div>
          </div>

          <div class="field">
            <span class="label">走行距離</span>
            <div class="value"><span data-log-field="mileage"></span> km</div>
          </div>

          <div class="field">
            <span class="label">整備区分</span>
            <div class="value"><span data-log-field="title"></span></div>
          </div>

          <div class="field">
            <span class="label">交換部品</span>
            <div class="value"><span data-log-field="parts"></span></div>
          </div>

          <div class="field">
            <span class="label">メモ</span>
            <div class="value"><span data-log-field="memo"></span></div>
          </div>

          ${(log.photoUrl || log.hasPhoto || log.photoAccess === 'fetch') ? '<h2 class="field" style="font-weight:900;margin-top:16px">📷 整備写真</h2><img alt="整備写真" id="ring-hist-photo" style="max-width:100%;border-radius:12px;display:block;margin:auto"/>' : ''}
          <a hidden id="editHistoryLink" class="edit-btn">
            この内容を編集する
          </a>
        </div>
      `;
      document.querySelectorAll('[data-log-field]').forEach(function (el) {
        el.textContent = log[el.dataset.logField] || '—';
        el.style.whiteSpace = 'pre-wrap';
      });
      var edit = document.getElementById('editHistoryLink');
      if (log.historyContentEditable) {
        edit.hidden = false;
        edit.href = 'factory_edit_detail.html?' + new URLSearchParams({ vin: vin, log_id: logId });
      }
      if (window.ringOwnerPlatformUi) {
        window.ringOwnerPlatformUi.wireDetailVisibilityToggle(log, vin);
        var img = document.getElementById('ring-hist-photo');
        if (img) window.ringOwnerPlatformUi.loadHistoryPhotoIfNeeded(log, vin, img);
      }
      hideLoading();
    }, showOverlay === false ? 0 : 300);
  }

  function ringHistoryDetailBackgroundSync_() {
    if (!vin || typeof syncMaintenanceHistoryForVin !== 'function') return;
    var prevSig = '';
    if (logId && typeof ringMaintenanceLogsSignature_ === 'function') {
      var log0 = getLogs().find(function (l) { return l.log_id == logId; });
      if (log0) prevSig = ringMaintenanceLogsSignature_([log0]);
    }
    syncMaintenanceHistoryForVin(vin).then(function (syncResult) {
      if (!syncResult || syncResult.ok !== true) return;
      if (!logId || typeof ringMaintenanceLogsSignature_ !== 'function') {
        render(false);
        return;
      }
      var log1 = getLogs().find(function (l) { return l.log_id == logId; });
      if (!log1) return;
      var newSig = ringMaintenanceLogsSignature_([log1]);
      if (newSig !== prevSig) render(false);
    }).catch(function () { /* ignore */ });
  }

  async function loadAndRender() {
    var content = document.getElementById('content');
    content.textContent = '履歴を確認中…';
    var result = await syncMaintenanceHistoryForVin(vin);
    if (!result.ok) {
      var detMsg = (typeof ringMaintenanceSyncUserMessage_ === 'function')
        ? ringMaintenanceSyncUserMessage_(result)
        : '履歴を取得できませんでした。通信を確認して再読み込みしてください。';
      content.textContent = detMsg || '履歴を取得できませんでした。通信を確認して再読み込みしてください。';
      return;
    }
    render(false);
  }
  window.addEventListener('ring-auth-context-changed', loadAndRender);
  window.addEventListener('DOMContentLoaded', loadAndRender);
</script>

</body>
</html>

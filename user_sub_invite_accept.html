<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>副ユーザー招待｜車のお薬手帳</title>
  <link rel="stylesheet" href="common.css?v=20261126-v67" integrity="sha256-urUbZlU7GPwDkd2DWP7qX12L9MdXGCfPsYEh5O7M17k= sha256-jzVvci++r0tpT1VuWcJ3zY7jed40bN/DaRnD3NFPnUA=">
  <script src="app.js?v=20261126-v67" integrity="sha256-LC2kKJE8S4ybFw6/Y9R7gZalAYyWiGW0HullHUBVmdc= sha256-jXAFBO25jZm/CKR8LYFTRnQ2to6HviM3WnDHDDFZDJc="></script>
  <script src="ring-browse-coordinator.js?v=20261126-v67" integrity="sha256-LK0KihDiraF2M9uU9sUCOMB2Wkw7J1+DTwNoTSpwDcw= sha256-y1p5UFI4z6BzFyw+WumXuxDEhVt36gCAYFcWqzDznFs="></script>
  <script src="owner-platform.js?v=20261126-v67" integrity="sha256-jkPEEL6P/TTdGlk1IYAtlA+fQ2ze9b2YI42KTekOpxw= sha256-FmuxpE+0WJ20pjGGo2DDoq14/UVNvRF1UzDgnrR9m7w="></script>
</head>
<body>
  <div class="container">
    <a href="user_home.html" class="back-link">◁ 戻る</a>
    <h1 class="title">副ユーザー招待の受諾</h1>
    <p id="msg" style="font-weight:700">処理中…</p>
    <button type="button" class="btn btn-primary" id="acceptBtn" style="display:none">招待を受け入れる</button>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      var params = new URLSearchParams(location.search);
      var grant = params.get('grant') || params.get('grantId') || '';
      var msg = document.getElementById('msg');
      var btn = document.getElementById('acceptBtn');
      if (!window.ringOwnerPlatform || !await ringOwnerPlatform.ready()) {
        msg.textContent = 'この機能は現在の環境では利用できません。';
        return;
      }
      if (!grant) {
        msg.textContent = '招待コードが見つかりません。オーナーにQRを再表示してもらってください。';
        return;
      }
      msg.textContent = 'オーナーからの副ユーザー招待です。受け入れると、許可された範囲のみ閲覧できます（公開設定・オーナー変更はできません）。';
      btn.style.display = '';
      btn.onclick = async function () {
        btn.disabled = true;
        var res;
        try { res = await ringOwnerPlatform.acceptSubInvite(grant); }
        catch (err) { res = { error: /EXPIRED/.test(String(err)) ? '招待の期限が切れています。再発行を依頼してください。' : '招待を確認できません。通信・ログイン状態を確認してください。' }; }
        if (res && res.success) {
          msg.textContent = '招待を受け入れました。車両: ' + (res.vin || '指定なし');
          if (typeof showToast === 'function') showToast('success', '副ユーザーとして登録しました');
        } else {
          msg.textContent = '受諾できませんでした: ' + ((res && res.error) || 'エラー');
          btn.disabled = false;
        }
      };
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja" data-ring-check-loading>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4b5563" />
  <title>貸出・返却 チェックシート</title>
  <style>html[data-ring-check-loading] .ring-check-layout { visibility: hidden; }</style>
  <script>
    (function () {
      var remaining = 3, failed = false;
      window.ringCheckAssetLoaded = function () {
        remaining -= 1;
        if (!failed && remaining === 0) document.documentElement.removeAttribute('data-ring-check-loading');
      };
      window.ringCheckAssetFailed = function () {
        failed = true;
        function show() {
          if (document.getElementById('ringCheckUpdateError')) return;
          var box = document.createElement('div');
          box.id = 'ringCheckUpdateError';
          box.setAttribute('role', 'alert');
          box.style.cssText = 'padding:24px;background:white;color:#222;position:fixed;inset:0;z-index:10000;overflow:auto';
          var message = document.createElement('p');
          message.textContent = '画面の更新ファイルを読み込めませんでした。通信を確認して再読み込みしてください。保存済みの下書き・未送信データは保持されています。';
          var retry = document.createElement('button');
          retry.type = 'button'; retry.textContent = '再読み込み';
          retry.onclick = function () { location.reload(); };
          box.append(message, retry); document.body.appendChild(box);
        }
        if (document.body) show(); else document.addEventListener('DOMContentLoaded', show, { once: true });
      };
    })();
  </script>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="fleet-check-sheet.css?v=20261114-v42" integrity="sha256-ycrkrvafkoyeJIuSNoPtNsJAzQBeG90MH7I+dJjsqkI= sha256-eeiCtwpSFNpjTjQsNAefmAssmHkwB7BFjT+syDvam/Q=" crossorigin="anonymous" onload="ringCheckAssetLoaded()" onerror="ringCheckAssetFailed()">
  <script src="app.js?v=20261114-v42" integrity="sha256-aT+0fIlNYULT6ndA9A87tM0+/wa2bPJr9vgv3CWo34g= sha256-xOVotDaeCes3eJdwrlE3aDEuZqvnaJ9fWbjnvp0o2Is=" crossorigin="anonymous" onerror="window.__ringAppLoadFailed=true;window.addEventListener('DOMContentLoaded',function(){var p=document.createElement('div');p.id='ringAppUpdateError';p.setAttribute('role','alert');p.style.cssText='padding:32px;background:white;color:#18344e;font:16px sans-serif';p.textContent='アプリの更新を確認できません。通信を確認して再読み込みしてください。端末内のデータは保持されています。';var b=document.createElement('button');b.textContent='再読み込み';b.onclick=function(){location.reload();};p.appendChild(b);document.body.replaceChildren(p);},{once:true})"></script>
  <script src="theme.js"></script>
</head>
<body class="ring-check-page">
  <div class="ring-check-layout">
    <header class="ring-check-top">
      <button type="button" id="ringCheckBack" class="ring-check-back">◁ 戻る</button>
      <div class="ring-check-top-main">
        <h1 class="ring-check-page-title">貸出・返却 チェックシート</h1>
        <div id="ringCheckHeader" class="ring-check-vehicle-line"></div>
      </div>
      <div id="ringCheckAttention" class="ring-check-attention" hidden></div>
      <div id="ringCheckLocalBanner" class="ring-check-local-banner"></div>
      <p id="ringCheckPhotoWarn" class="ring-check-photo-warn"></p>
    </header>

    <nav class="ring-check-main-tabs" id="ringCheckSteps" aria-label="チェックシート区分">
      <button type="button" class="is-active" data-step="exterior">外装（展開図）</button>
      <button type="button" data-step="inspect">点検項目</button>
    </nav>

    <main id="ringCheckMain" class="ring-check-main">
      <section class="ring-check-pane is-active" data-pane="exterior" id="ringCheckPaneExterior">
        <div class="ring-check-diagram-wrap">
          <p class="ring-check-hint ring-check-hint-compact">傷・へこみを付けたい場所をタップ。マークは端末に下書き保存されます。</p>
          <div id="ringCheckDiagramHost" class="ring-check-diagram-host"></div>
        </div>
        <aside class="ring-check-side ring-check-side-inline">
          <h2 class="ring-check-section-title">マーク一覧</h2>
          <div id="ringCheckMarkList" class="ring-check-mark-list"></div>
          <button type="button" id="ringCheckSaveSnap" class="ring-check-save-btn">この端末に保存</button>
        </aside>
        <div id="ringCheckDetail" class="ring-check-detail" hidden></div>
        <section class="ring-check-subblock" id="ringCheckPanePhotos"></section>
        <section class="ring-check-subblock" id="ringCheckPanePdf"></section>
      </section>

      <section class="ring-check-pane" data-pane="inspect" id="ringCheckPaneInspect">
        <section id="ringCheckPaneBasic"></section>
        <section id="ringCheckPaneInspection"></section>
        <section id="ringCheckPaneTires"></section>
      </section>
    </main>

    <nav class="ring-check-toolbar" id="ringCheckMarkToolbar" aria-label="マーク操作" hidden>
      <button type="button" data-check-mode="scratch" class="is-active"><span aria-hidden="true">●</span> 傷</button>
      <button type="button" data-check-mode="dent"><span aria-hidden="true">×</span> へこみ</button>
      <button type="button" data-check-mode="other"><span aria-hidden="true">□</span> その他</button>
      <button type="button" data-check-mode="delete"><span aria-hidden="true">🗑</span> 削除</button>
      <button type="button" id="ringCheckUndo"><span aria-hidden="true">↩</span> 戻す</button>
    </nav>
  </div>
  <input type="file" id="ringCheckPhotoInput" accept="image/*" multiple hidden />
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="fleet-check-sheet.js?v=20261114-v42" integrity="sha256-yXMYbQ2eEoIGSfMbVwDEDCVCeccs3SXJDGC0/nkUNMo= sha256-cBXKxzQEFsD0fqpr5prMEsyqeqgNr85n63VGoOkMLsw=" crossorigin="anonymous" onload="ringCheckAssetLoaded()" onerror="ringCheckAssetFailed()"></script>
  <script src="fleet-check-sheet-pdf.js?v=20261114-v42" integrity="sha256-1MDGUrXhjYrg1v9DVWxzfQz95crOoTZ3kF+e0b6Cz9s= sha256-pN8saJslYgNTvY66UVR9Jm9U/qw1kZwlFV1oJ9MKm8I=" crossorigin="anonymous" onload="ringCheckAssetLoaded()" onerror="ringCheckAssetFailed()"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja" data-ring-check-loading>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4b5563" />
  <title>車両チェックシート</title>
  <style>html[data-ring-check-loading] .ring-check-layout { visibility: hidden; }</style>
  <script>
    // Never enable a mixed-release check sheet. No business storage is cleared on failure.
    (function () {
      var remaining = 3, failed = false;
      window.ringCheckAssetLoaded = function () {
        remaining -= 1;
        if (!failed && remaining === 0) document.documentElement.removeAttribute('data-ring-check-loading');
      };
      window.ringCheckAssetFailed = function () {
        failed = true;
        function show() {
          if (document.getElementById('ringCheckUpdateError')) return;
          var box = document.createElement('div');
          box.id = 'ringCheckUpdateError';
          box.setAttribute('role', 'alert');
          box.style.cssText = 'padding:24px;background:white;color:#222;position:fixed;inset:0;z-index:10000;overflow:auto';
          var message = document.createElement('p');
          message.textContent = '画面の更新ファイルを読み込めませんでした。通信を確認して再読み込みしてください。保存済みの下書き・未送信データは保持されています。';
          var retry = document.createElement('button');
          retry.type = 'button'; retry.textContent = '再読み込み';
          retry.onclick = function () { location.reload(); };
          box.append(message, retry); document.body.appendChild(box);
        }
        if (document.body) show(); else document.addEventListener('DOMContentLoaded', show, { once: true });
      };
    })();
  </script>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="fleet-check-sheet.css?v=20261114-v38" integrity="sha256-EVmhKK7WTVeI8GjIH7VreCtlmPXeZuR0cU2isiaFlGk= sha256-KPArd1ve8evsTouhjXnTJsRA/y4yeOkWS6pX4Tzq9Qo=" crossorigin="anonymous" onload="ringCheckAssetLoaded()" onerror="ringCheckAssetFailed()">
  <script src="app.js?v=20261114-v39"></script>
  <script src="theme.js"></script>
</head>
<body class="ring-check-page">
  <div class="ring-check-layout">
    <header class="ring-check-top">
      <button type="button" id="ringCheckBack" class="ring-check-back">◁ 戻る</button>
      <div id="ringCheckHeader"></div>
      <div id="ringCheckAttention" class="ring-check-attention" hidden></div>
      <div id="ringCheckLocalBanner" class="ring-check-local-banner"></div>
      <div id="ringCheckPhotoWarn" class="ring-check-photo-warn"></div>
    </header>

    <nav class="ring-check-steps" id="ringCheckSteps" aria-label="チェックシート区分">
      <button type="button" class="is-active" data-step="basic">基本</button>
      <button type="button" data-step="inspection">点検</button>
      <button type="button" data-step="tires">タイヤ</button>
      <button type="button" data-step="diagram">展開図</button>
      <button type="button" data-step="photos">写真</button>
      <button type="button" data-step="pdf">PDF</button>
    </nav>

    <main id="ringCheckMain" class="ring-check-main">
      <section class="ring-check-pane is-active" data-pane="basic" id="ringCheckPaneBasic"></section>
      <section class="ring-check-pane" data-pane="inspection" id="ringCheckPaneInspection"></section>
      <section class="ring-check-pane" data-pane="tires" id="ringCheckPaneTires"></section>
      <section class="ring-check-pane" data-pane="diagram" id="ringCheckPaneDiagram">
        <div class="ring-check-columns ring-check-diagram-column">
          <div class="ring-check-diagram-wrap">
            <h2 class="ring-check-section-title">車両展開図</h2>
            <div id="ringCheckDiagramHost" class="ring-check-diagram-host"></div>
          </div>
          <aside class="ring-check-side">
            <h2 class="ring-check-section-title">マーク一覧</h2>
            <div id="ringCheckMarkList" class="ring-check-mark-list"></div>
            <button type="button" id="ringCheckSaveSnap" class="ring-check-save-btn">この端末に保存（スナップショット）</button>
          </aside>
        </div>
        <div id="ringCheckDetail" class="ring-check-detail" hidden></div>
      </section>
      <section class="ring-check-pane" data-pane="photos" id="ringCheckPanePhotos"></section>
      <section class="ring-check-pane" data-pane="pdf" id="ringCheckPanePdf"></section>
    </main>

    <nav class="ring-check-toolbar" id="ringCheckMarkToolbar" aria-label="マーク操作" hidden>
      <button type="button" data-check-mode="scratch" class="is-active"><span aria-hidden="true">●</span> 傷</button>
      <button type="button" data-check-mode="dent"><span aria-hidden="true">×</span> へこみ</button>
      <button type="button" data-check-mode="other"><span aria-hidden="true">□</span> その他</button>
      <button type="button" data-check-mode="delete"><span aria-hidden="true">🗑</span> 削除</button>
      <button type="button" id="ringCheckUndo"><span aria-hidden="true">↩</span> 戻す</button>
    </nav>
  </div>
  <input type="file" id="ringCheckPhotoInput" accept="image/*" multiple hidden />
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="fleet-check-sheet.js?v=20261114-v38" integrity="sha256-rpZSqUshcq28CcSrCVXH+l1C9FVRBGG6uTWc9wY4lMI= sha256-viSaVMYEdD552sIBNcmT37CSIqcCwKauvyHu8XGxFHA=" crossorigin="anonymous" onload="ringCheckAssetLoaded()" onerror="ringCheckAssetFailed()"></script>
  <script src="fleet-check-sheet-pdf.js?v=20261114-v38" integrity="sha256-eIhE5nHgLG7JtrrPg/2KWXLthFs6a/hw3jN9Om3hiJ0= sha256-NScDmcLRX00URaRYH+y63JILS/0VZj0Tou1Ja7eUfX8=" crossorigin="anonymous" onload="ringCheckAssetLoaded()" onerror="ringCheckAssetFailed()"></script>
</body>
</html>

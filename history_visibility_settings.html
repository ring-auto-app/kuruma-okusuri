<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>整備履歴の公開設定｜車のお薬手帳</title>
  <link rel="stylesheet" href="common.css?v=20261124-v64" integrity="sha256-NkoMIhaXKAgB1LdYLpSuHbLMColQulcEn88zUKGEUkw= sha256-+xpjMkJDeRprQ2WIwiRIdk2GWiIGvQ4a7sE/dzEs1zc=">
  <script src="app.js?v=20261124-v64" integrity="sha256-2D2GzKWMQ1icwqudkAErbt7JB/ILFK+QmMNQ7dv9dyY= sha256-SGBE+x8tvhy9/kAuqMmbqEt77SQBMePdKk9uLMzJbcM="></script>
  <script src="owner-platform.js?v=20261124-v64" integrity="sha256-9NMxbN/nLqDtbnU61091juoQouSv3egfSKXP+W/svSk= sha256-mcbxkbvK1YuwqASWD5iBdNV39empv7e0QH4E3FLqWXk="></script>
  <script src="owner-platform-ui.js?v=20261124-v64" integrity="sha256-Uy+hRyNmnud+zYsVIwXVVePIoZpheBGaw38bb3duYCQ= sha256-b2UvGA12g5qVesGg47bFWRsTXVcUtRbiQlVC2J/oJ7c="></script>
  <style>
    .hvs-section { margin-bottom: 20px; }
    .hvs-section h2 { font-size: 15px; margin: 0 0 8px; font-weight: 900; }
    .hvs-note { font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.55; margin: 0 0 12px; }
    .hvs-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border-radius: 10px; background: var(--paper); margin-bottom: 8px;
      border: 1px solid rgba(0,0,0,0.08);
    }
    .hvs-row-title { font-size: 13px; font-weight: 900; }
    .hvs-row-meta { font-size: 11px; font-weight: 700; color: var(--muted); }
    .hvs-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .hvs-status-loading { font-weight: 800; color: var(--muted); }
    .hvs-status-error { font-weight: 800; color: #9b2525; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="#" id="hvsBack" class="back-link">◁ 戻る</a>
      <h1 class="title">🔒 整備履歴の公開設定</h1>
    </header>
    <p class="hvs-note">公開にすると車台番号で検索した人が閲覧できます。非公開でも、当時のオーナー・入力した工場・閲覧を許可した店舗は確認できます。</p>
    <div id="hvsRoot">読み込み中…</div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      var OP = window.ringOwnerPlatform;
      var OPUI = window.ringOwnerPlatformUi;
      var root = document.getElementById('hvsRoot');
      var profile = typeof loadProfile === 'function' ? loadProfile() : null;
      var isUser = profile && profile.shopType === 'user';
      var back = document.getElementById('hvsBack');
      if (back) {
        back.href = isUser ? 'user_home.html' : (profile && profile.shopType === 'dealer' ? 'dealer_home.html' : 'factory_home.html');
      }

      if (!OP || !(await OP.ready())) {
        root.innerHTML = '<div class="card">オーナー機能の準備ができていません。通信を確認してから再度お試しください。</div>';
        return;
      }

      var defaultHint = '';
      try {
        defaultHint = localStorage.getItem('ring_owner_default_vis') || '（未設定・公開が既定）';
      } catch (e0) { defaultHint = '（未設定・公開が既定）'; }

      root.innerHTML =
        '<div class="hvs-section" id="hvsDefaultBlock">' +
        '<h2>今後の整備履歴の初期公開設定</h2>' +
        '<p class="hvs-note" id="hvsDefaultLabel">現在の設定: ' + escapeHtml(defaultHint) + '</p>' +
        '<div class="hvs-actions" id="hvsDefaultActions"></div></div>' +
        '<div class="hvs-section"><h2>変更できる整備履歴</h2>' +
        '<p class="hvs-note">ここでは、公開・非公開を変更できる整備履歴だけを表示します。</p>' +
        '<div id="hvsLogList" class="hvs-status-loading" role="status">履歴を読み込み中…</div></div>';

      if (!isUser) {
        document.getElementById('hvsDefaultBlock').innerHTML =
          '<h2>今後の整備履歴の初期公開設定</h2>' +
          '<p class="hvs-note">新規履歴の既定公開設定は、車両オーナー（一般ユーザー）が設定します。工場・事業者は入力した履歴の公開状態を、権限がある場合のみ変更できます。</p>';
      } else {
        var act = document.getElementById('hvsDefaultActions');
        act.innerHTML =
          '<button type="button" class="btn btn-secondary" id="hvsSetPublic">公開を既定にする</button>' +
          '<button type="button" class="btn btn-secondary" id="hvsSetPrivate">非公開を既定にする</button>';
        document.getElementById('hvsSetPublic').onclick = function () { saveDefault_('public', '公開'); };
        document.getElementById('hvsSetPrivate').onclick = function () { saveDefault_('private', '非公開'); };
      }

      await loadEditableLogs_();

      async function saveDefault_(value, label) {
        try {
          var res = await OP.setDefaultVisibility(value);
          if (!res || res.success !== true) throw new Error('SAVE');
          try { localStorage.setItem('ring_owner_default_vis', label); } catch (e1) { /* ignore */ }
          document.getElementById('hvsDefaultLabel').textContent = '現在の設定: ' + label;
          if (typeof showToast === 'function') showToast('success', '新規履歴は「' + label + '」が既定になります');
        } catch (err) {
          if (typeof showToast === 'function') showToast('error', '初期設定を保存できませんでした。再試行してください。');
        }
      }

      function pickEditableLogs_(logs) {
        if (!OPUI || typeof OPUI.filterEditableVisibilityLogs !== 'function') return [];
        return OPUI.filterEditableVisibilityLogs(logs);
      }

      function hvsRowHtml_(log) {
        var state = OPUI && typeof OPUI.historyVisibilityUiState === 'function'
          ? OPUI.historyVisibilityUiState(log)
          : { label: '公開', checked: false };
        return '<div class="hvs-row" data-hvs-row="' + escapeHtml(log.log_id) + '">' +
          '<div><div class="hvs-row-title">' + escapeHtml(log.title || log.date || '整備') + '</div>' +
          '<div class="hvs-row-meta">' + escapeHtml(log.vin) + ' · ' + escapeHtml(log.date || '') +
          ' · <span data-ring-vis-state>' + escapeHtml(state.label) + '</span></div></div>' +
          '<label class="hvs-toggle ring-vis-compact">' +
          '<input type="checkbox" data-log-id="' + escapeHtml(log.log_id) + '" data-vin="' + escapeHtml(log.vin) + '"' +
          (state.checked ? ' checked' : '') + ' aria-label="非公開">非公開' +
          '<span class="ring-vis-save-status" data-ring-vis-status="' + escapeHtml(log.log_id) + '" hidden></span></label>' +
          '</div>';
      }

      function refreshHvsRow_(logId, vin) {
        if (!OPUI || typeof getMaintenanceLogsByVin !== 'function') return;
        var log = getMaintenanceLogsByVin(vin).find(function (l) { return l && l.log_id === logId; });
        if (!log) return;
        var row = document.getElementById('hvsLogList').querySelector('[data-hvs-row="' + logId + '"]');
        if (row && typeof OPUI.syncHistoryVisibilityRowDom === 'function') {
          OPUI.syncHistoryVisibilityRowDom(row, log);
        }
      }

      function wireHvsToggle_(el, log) {
        if (!el || !log || !OPUI || typeof OPUI.wireVisibilityCheckbox !== 'function') return;
        OPUI.wireVisibilityCheckbox(el, log, log.vin, function () {
          refreshHvsRow_(log.log_id, log.vin);
        });
      }

      async function loadEditableLogs_() {
        var listEl = document.getElementById('hvsLogList');
        listEl.className = 'hvs-status-loading';
        listEl.textContent = '履歴を読み込み中…';
        var cars = typeof loadVehicles === 'function' ? loadVehicles() : [];
        var vins = cars.map(function (c) { return c.vin; }).filter(Boolean);
        if (!vins.length) {
          listEl.className = '';
          listEl.innerHTML = '<div class="card">登録車両がありません。車両を登録してから再度開いてください。</div>';
          return;
        }
        var rows = [];
        var syncOkCount = 0;
        var syncFailCount = 0;
        var concurrency = 3;
        var idx = 0;
        async function worker() {
          while (idx < vins.length) {
            var vin = vins[idx++];
            try {
              var sync = typeof syncMaintenanceHistoryForVin === 'function'
                ? await syncMaintenanceHistoryForVin(vin)
                : { ok: false };
              if (!sync || sync.ok !== true) {
                syncFailCount++;
                continue;
              }
              syncOkCount++;
              var logs = typeof getMaintenanceLogsByVin === 'function' ? getMaintenanceLogsByVin(vin) : (sync.logs || []);
              pickEditableLogs_(logs).forEach(function (log) {
                rows.push(log);
              });
            } catch (eSync) {
              syncFailCount++;
            }
          }
        }
        await Promise.all(Array.from({ length: Math.min(concurrency, vins.length) }, function () { return worker(); }));

        listEl.className = '';
        if (syncOkCount === 0 && syncFailCount > 0) {
          listEl.innerHTML = '<div class="card hvs-status-error" role="alert">' +
            '履歴を取得できませんでした。通信を確認してから再度お試しください。</div>';
          return;
        }
        if (!rows.length) {
          listEl.innerHTML = '<div class="card">公開設定を変更できる整備履歴はありません。</div>';
          if (syncFailCount > 0) {
            listEl.insertAdjacentHTML('beforeend',
              '<p class="hvs-note hvs-status-error" role="status">一部の車両の履歴は取得できませんでした。表示は取得できた分のみです。</p>');
          }
          return;
        }
        rows.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
        listEl.innerHTML = rows.map(hvsRowHtml_).join('');
        rows.forEach(function (log) {
          var cb = listEl.querySelector('[data-hvs-row="' + log.log_id + '"] input[type=checkbox]');
          wireHvsToggle_(cb, log);
        });
        if (syncFailCount > 0) {
          listEl.insertAdjacentHTML('beforeend',
            '<p class="hvs-note hvs-status-error" role="status">一部の車両の履歴は取得できませんでした。表示は変更可能な履歴のみです。</p>');
        }
      }
    });
  </script>
</body>
</html>

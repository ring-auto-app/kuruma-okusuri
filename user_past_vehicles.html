<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>過去の車両｜車のお薬手帳</title>
  <link rel="stylesheet" href="common.css?v=20261126-v67" integrity="sha256-urUbZlU7GPwDkd2DWP7qX12L9MdXGCfPsYEh5O7M17k= sha256-jzVvci++r0tpT1VuWcJ3zY7jed40bN/DaRnD3NFPnUA=">
  <script src="app.js?v=20261126-v67" integrity="sha256-LC2kKJE8S4ybFw6/Y9R7gZalAYyWiGW0HullHUBVmdc= sha256-jXAFBO25jZm/CKR8LYFTRnQ2to6HviM3WnDHDDFZDJc="></script>
  <script src="ring-browse-coordinator.js?v=20261126-v67" integrity="sha256-LK0KihDiraF2M9uU9sUCOMB2Wkw7J1+DTwNoTSpwDcw= sha256-y1p5UFI4z6BzFyw+WumXuxDEhVt36gCAYFcWqzDznFs="></script>
  <script src="owner-platform.js?v=20261126-v67" integrity="sha256-jkPEEL6P/TTdGlk1IYAtlA+fQ2ze9b2YI42KTekOpxw= sha256-FmuxpE+0WJ20pjGGo2DDoq14/UVNvRF1UzDgnrR9m7w="></script>
  <script src="vendor/qr/qrcode.js?v=20261126-v67" integrity="sha256-GK45n4EYK8nekW6cd7GV3yDMWNby1VpisIWimfG/F4A= sha256-S2Ezy7WhPs3CbPqJfQ2ve7mwgjIDLN04HoLyuvNlO18="></script>
  <script src="owner-platform-ui.js?v=20261126-v67" integrity="sha256-YyJfZNKrVtNKTciBarXaskIY57ypFBrD93ztIiS4mfI= sha256-8sxNEjWRwx0AZZzeOOpIqNRZ46QlD7w7DKpNB4a1Vok="></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="user_home.html" class="back-link">◁ 戻る</a>
      <h1 class="title">過去の車両</h1>
    </header>
    <p style="font-size:13px;font-weight:700;color:var(--muted)">登録一覧から外した車両です。あなたの管理期間の整備履歴は引き続き確認できます。</p>
    <div id="list"></div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      if (!window.ringOwnerPlatform || !await ringOwnerPlatform.ready()) {
        document.getElementById('list').innerHTML = '<div class="card">この機能は準備中です。</div>';
        return;
      }
      var list = document.getElementById('list');
      list.textContent = '読み込み中…';
      try {
        var json = await ringOwnerPlatform.listPastVehicles();
        if (!json.success) throw new Error('READ_FAILED');
      } catch (err) { list.textContent = '一覧を取得できませんでした。通信を確認して再読み込みしてください。'; return; }
      var rows = (json && json.vehicles) || [];
      if (!rows.length) {
        document.getElementById('list').innerHTML = '<div class="card">過去の車両はありません。</div>';
        return;
      }
      document.getElementById('list').innerHTML = rows.map(function (r) {
        return '<div class="card"><strong>' + escapeHtml(r.vin) + '</strong><br><span style="font-size:12px">外した日: ' +
          escapeHtml(r.archivedAt || '') + '</span><br><a class="btn btn-secondary" style="margin-top:8px" href="history.html?vin=' +
          encodeURIComponent(r.vin) + '">整備履歴を見る</a></div>';
      }).join('');
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>過去の車両｜車のお薬手帳</title>
  <link rel="stylesheet" href="common.css?v=20261119-v53" integrity="sha256-gLucbh3x/eHe8dwKjoDqhIUOP4FyREhbu0/Nw6Ru/Jg= sha256-osnzRLygeh+f5oe7OwTD0igkrzro60pxtPktN7UnkC8=">
  <script src="app.js?v=20261119-v53" integrity="sha256-mYkvMkMthkjAxQuNG5iBpOPOVghxdn4q2eWB9kexH+0= sha256-XB/v5iOjR2mMPWO/lkxrNQxLvQUbaYHXnNiTLSc2q2o="></script>
  <script src="owner-platform.js?v=20261119-v53" integrity="sha256-9NMxbN/nLqDtbnU61091juoQouSv3egfSKXP+W/svSk= sha256-mcbxkbvK1YuwqASWD5iBdNV39empv7e0QH4E3FLqWXk="></script>
  <script src="vendor/qr/qrcode.js?v=20261119-v53" integrity="sha256-GK45n4EYK8nekW6cd7GV3yDMWNby1VpisIWimfG/F4A= sha256-S2Ezy7WhPs3CbPqJfQ2ve7mwgjIDLN04HoLyuvNlO18="></script>
  <script src="owner-platform-ui.js?v=20261119-v53" integrity="sha256-TKudcu3501uHW0tdKworFpoHKbC+HaME+pfzfiM/LVE= sha256-UfHI4Jjo0iVeFBqLpoHdc4aQKHWrJ1pzl3H3rxt/NLI="></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="user_home.html" class="back-link">◁ 戻る</a>
      <h1 class="title">過去の車両</h1>
    </header>
    <p style="font-size:13px;font-weight:700;color:var(--muted)">登録一覧から外した車両です。あなたの管理期間の整備履歴は引き続き確認できます。</p>
    <div id="list"></div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      if (!window.ringOwnerPlatform || !await ringOwnerPlatform.ready()) {
        document.getElementById('list').innerHTML = '<div class="card">この機能は準備中です。</div>';
        return;
      }
      var list = document.getElementById('list');
      list.textContent = '読み込み中…';
      try {
        var json = await ringOwnerPlatform.listPastVehicles();
        if (!json.success) throw new Error('READ_FAILED');
      } catch (err) { list.textContent = '一覧を取得できませんでした。通信を確認して再読み込みしてください。'; return; }
      var rows = (json && json.vehicles) || [];
      if (!rows.length) {
        document.getElementById('list').innerHTML = '<div class="card">過去の車両はありません。</div>';
        return;
      }
      document.getElementById('list').innerHTML = rows.map(function (r) {
        return '<div class="card"><strong>' + escapeHtml(r.vin) + '</strong><br><span style="font-size:12px">外した日: ' +
          escapeHtml(r.archivedAt || '') + '</span><br><a class="btn btn-secondary" style="margin-top:8px" href="history.html?vin=' +
          encodeURIComponent(r.vin) + '">整備履歴を見る</a></div>';
      }).join('');
    });
  </script>
</body>
</html>
